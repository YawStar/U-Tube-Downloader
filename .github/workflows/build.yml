name: Build Application

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository ကို Clone လုပ်ခြင်း
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python တပ်ဆင်ခြင်း
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Astral uv တပ်ဆင်ခြင်း
      - name: Install uv
        uses: astral-sh/setup-uv@v3

      # 4. UPX Latest တပ်ဆင်ခြင်း
      - name: Install UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y upx

      # 5. Build Script ကို Run ခြင်း
      - name: Run build script
        run: |
          uv run python build.py

      # 6. ထွက်လာသည့် Binary / Folder ကို Download ယူနိုင်ရန် Upload တင်ခြင်း
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YawStar_U-Tube_Downloader-Linux
          path: dist/YawStar_U-Tube_Downloader/