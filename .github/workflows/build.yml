# ═══════════════════════════════════════════════════════════════════════════
# GitHub Actions Workflow - Multi-Platform Build
# ═══════════════════════════════════════════════════════════════════════════
# ဤ workflow သည် YawStar U-Tube Downloader ကို platform ၆ မျိုးအတွက်
# PyInstaller ဖြင့် build လုပ်ပေးရန်ရေးထားသည်:
#   1. Windows 11 x64
#   2. Windows 11 arm64
#   3. Ubuntu Linux amd64
#   4. Ubuntu Linux arm64
#   5. macOS amd64 (Intel)
#   6. macOS arm64 (Apple Silicon)
#
# Build လုပ်ပြီးသည့်အခါ archive များကို artifact အဖြစ် upload လုပ်ပြီး
# git tag (v*) push လုပ်သည့်အခါ GitHub Release တွင် အလိုအလျောက် attach လုပ်ပါသည် (လောလောဆယ်ပိတ်ထား)။
# ═══════════════════════════════════════════════════════════════════════════

name: Build Multi-Platform

# ─── Workflow စတင်အလုပ်လုပ်မည့် Events ───
on:
#   # main branch သို့ push လုပ်သည့်အခါ run
#   push:
#     branches: [ main ]
#     # v* format ဖြင့် tag push လုပ်သည့်အခါ release job ပါ run
#     tags:
#       - 'v*'

#   # main branch သို့ Pull Request ဖွင့်သည့်အခါ run
#   pull_request:
#     branches: [ main ]

  # GitHub UI မှ manual run လုပ်နိုင်ရန်
  workflow_dispatch:

# ─── Global Environment Variables ───
env:
  PYTHON_VERSION: '3.13'      # Python version (3.12+ သည် ARM64 support ကောင်း)
  UV_VERSION: '0.5.11'        # uv package manager version

# ─── Jobs ───
jobs:
  # ═════════════════════════════════════════════════════════════════════════
  # Job 1: Build - Platform ၆ မျိုးအတွက် parallel build
  # ═════════════════════════════════════════════════════════════════════════
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    # ─── Matrix Strategy - Platform ၆ မျိုး သတ်မှတ်ခြင်း ───
    strategy:
      # fail-fast: false ဆိုလျှင် platform တစ်ခု fail ဖြစ်လျှင်လည်း ကျန်တာများ ဆက်လက် run
      fail-fast: false

      matrix:
        include:
          # ─── Windows x64 ───
          - name: windows-x64
            os: windows-latest                          # Windows Server 2022 x64
            platform: windows
            arch: amd64
            artifact_name: YawStar-U-Tube-Downloader-windows-x64
            output_dir: dist/Windows                   # build.py က ဤနေရာတွင် ထုတ်သည်
            app_folder: "YawStar U-Tube Downloader"    # PyInstaller output folder အမည်
            executable: "YawStar U-Tube Downloader.exe"
            archive_ext: zip
            archive_name: YawStar-U-Tube-Downloader-windows-x64

          # ─── Windows arm64 (GitHub public preview) ───
          - name: windows-arm64
            os: windows-11-arm                          # Windows 11 ARM64 (preview)
            platform: windows
            arch: arm64
            artifact_name: YawStar-U-Tube-Downloader-windows-arm64
            output_dir: dist/Windows
            app_folder: "YawStar U-Tube Downloader"
            executable: "YawStar U-Tube Downloader.exe"
            archive_ext: zip
            archive_name: YawStar-U-Tube-Downloader-windows-arm64

          # ─── Linux amd64 ───
          - name: linux-amd64
            os: ubuntu-latest                           # Ubuntu 24.04 x64
            platform: linux
            arch: amd64
            artifact_name: YawStar-U-Tube-Downloader-linux-amd64
            output_dir: dist/Linux/amd64
            app_folder: "YawStar_U-Tube_Downloader"
            executable: "YawStar_U-Tube_Downloader"
            archive_ext: tar.gz
            archive_name: YawStar-U-Tube-Downloader-linux-amd64

          # ─── Linux arm64 (GitHub public preview) ───
          - name: linux-arm64
            os: ubuntu-24.04-arm                        # Ubuntu 24.04 ARM64 (preview)
            platform: linux
            arch: arm64
            artifact_name: YawStar-U-Tube-Downloader-linux-arm64
            output_dir: dist/Linux/arm64
            app_folder: "YawStar_U-Tube_Downloader"
            executable: "YawStar_U-Tube_Downloader"
            archive_ext: tar.gz
            archive_name: YawStar-U-Tube-Downloader-linux-arm64

          # ─── macOS amd64 (Intel) ───
          - name: macos-amd64
            os: macos-13                                # macOS 13 (Intel x64)
            platform: darwin
            arch: amd64
            artifact_name: YawStar-U-Tube-Downloader-macos-amd64
            output_dir: dist/macOS/amd64
            app_folder: "YawStar U-Tube Downloader"
            executable: "YawStar U-Tube Downloader"
            archive_ext: tar.gz
            archive_name: YawStar-U-Tube-Downloader-macos-amd64

          # ─── macOS arm64 (Apple Silicon) ───
          - name: macos-arm64
            os: macos-14                                # macOS 14 (Apple Silicon M1)
            platform: darwin
            arch: arm64
            artifact_name: YawStar-U-Tube-Downloader-macos-arm64
            output_dir: dist/macOS/arm64
            app_folder: "YawStar U-Tube Downloader"
            executable: "YawStar U-Tube Downloader"
            archive_ext: tar.gz
            archive_name: YawStar-U-Tube-Downloader-macos-arm64

    # ─── Steps (အဆင့်ဆင့် လုပ်ဆောင်ချက်များ) ───
    steps:
      # ─────────────────────────────────────────────────────────────
      # Step 1: Repository code ကို runner သို့ checkout လုပ်ခြင်း
      # ─────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────────
      # Step 2: Python install လုပ်ခြင်း (pip cache အလိုအလျောက် enable)
      # ─────────────────────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ─────────────────────────────────────────────────────────────
      # Step 3: uv package manager install လုပ်ခြင်း
      # (build.py က "uv run --with pyinstaller" ကို သုံးသောကြောင့် လိုအပ်)
      # ─────────────────────────────────────────────────────────────
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true              # uv cache enable (build မြန်စေရန်)

      # ─────────────────────────────────────────────────────────────
      # Step 4: Runner အချက်အလက်များ ပြသခြင်း (debug အတွက်)
      # ─────────────────────────────────────────────────────────────
      - name: Display runner info
        shell: bash
        run: |
          echo "=== Runner Info ==="
          echo "OS: ${{ runner.os }}"
          echo "Arch: ${{ runner.arch }}"
          echo "Platform: ${{ matrix.platform }}"
          echo "Target arch: ${{ matrix.arch }}"
          echo "=== Tools ==="
          python --version
          uv --version
          echo "=== Python platform ==="
          python -c "import platform; print('machine:', platform.machine()); print('system:', platform.system())"

      # ─────────────────────────────────────────────────────────────
      # Step 5: Linux system dependencies install လုပ်ခြင်း
      # (PySide6/Qt GUI app များအတွက် GTK, NSS, X11 libraries လိုအပ်)
      # ─────────────────────────────────────────────────────────────
      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 \
            libnotify4 \
            libnss3 \
            libxss1 \
            libxtst6 \
            xdg-utils \
            libatspi2.0-0 \
            libayatana-appindicator3-1 \
            libgirepository1.0-dev \
            libcairo2-dev \
            pkg-config \
            python3-dev \
            gir1.2-gtk-3.0

      # ─────────────────────────────────────────────────────────────
      # Step 6: လိုအပ်သော ဖိုင်များ ရှိ/မရှိ စစ်ဆေးခြင်း
      # ─────────────────────────────────────────────────────────────
      - name: Verify required files exist
        shell: bash
        run: |
          echo "Checking required files..."
          test -f main.py || { echo "❌ main.py not found"; exit 1; }
          test -f ui/settings_dialog.ui || { echo "❌ ui/settings_dialog.ui not found"; exit 1; }
          test -f build.py || { echo "❌ build.py not found"; exit 1; }
          echo "✅ All required files present"
          echo "Project structure:"
          ls -la

      # ─────────────────────────────────────────────────────────────
      # Step 7: build.py ကို run ခြင်း (PyInstaller build လုပ်သည်)
      # ─────────────────────────────────────────────────────────────
      - name: Run build.py
        shell: bash
        run: |
          python build.py

      # ─────────────────────────────────────────────────────────────
      # Step 8: Build output ကို verify လုပ်ခြင်း
      # ─────────────────────────────────────────────────────────────
      - name: Verify build output
        shell: bash
        run: |
          echo "=== Checking output directory ==="
          ls -la "${{ matrix.output_dir }}" || true

          APP_PATH="${{ matrix.output_dir }}/${{ matrix.app_folder }}/${{ matrix.executable }}"
          echo "Looking for: $APP_PATH"

          if [ ! -f "$APP_PATH" ]; then
            echo "❌ Build output not found!"
            echo "Listing all files in output dir:"
            find "${{ matrix.output_dir }}" -type f | head -50
            exit 1
          fi
          echo "✅ Build output verified"

      # ─────────────────────────────────────────────────────────────
      # Step 9: Archive ဖန်တီးခြင်း (Linux/macOS - tar.gz)
      # ─────────────────────────────────────────────────────────────
      - name: Package archive (Linux/macOS)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          cd "${{ matrix.output_dir }}"
          # App folder ကို tar.gz ဖြင့် ချုံ့
          tar -czf "$GITHUB_WORKSPACE/${{ matrix.archive_name }}.tar.gz" "${{ matrix.app_folder }}"
          echo "✅ Created archive: ${{ matrix.archive_name }}.tar.gz"
          ls -lh "$GITHUB_WORKSPACE/${{ matrix.archive_name }}.tar.gz"

      # ─────────────────────────────────────────────────────────────
      # Step 10: Archive ဖန်တီးခြင်း (Windows - zip)
      # ─────────────────────────────────────────────────────────────
      - name: Package archive (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cd "${{ matrix.output_dir }}"
          Compress-Archive -Path "${{ matrix.app_folder }}" -DestinationPath "$env:GITHUB_WORKSPACE/${{ matrix.archive_name }}.zip" -Force
          Write-Host "✅ Created archive: ${{ matrix.archive_name }}.zip"
          Get-Item "$env:GITHUB_WORKSPACE/${{ matrix.archive_name }}.zip" | Format-List

      # ─────────────────────────────────────────────────────────────
      # Step 11: Archive ကို artifact အဖြစ် upload လုပ်ခြင်း
      # ─────────────────────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_name }}.${{ matrix.archive_ext }}
          retention-days: 30              # ၃၀ ရက် သိမ်းထားမည်
          if-no-files-found: error        # ဖိုင်မတွေ့လျှင် error ပေးမည်

